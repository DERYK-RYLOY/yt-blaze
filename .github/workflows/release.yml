name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Install NSIS
        run: |
          choco install nsis --no-progress -y
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Vet backend
        run: go vet ./...

      - name: Build app and installer
        run: wails build -platform windows/amd64 -nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yt-blaze-windows-amd64
          path: |
            build/bin/YT Blaze.exe
            build/bin/*-installer.exe
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/YT Blaze.exe
            build/bin/*-installer.exe
          generate_release_notes: true
